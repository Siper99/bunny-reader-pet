      <h1>窗边的兔子</h1>
      <p>她推开窗，夜色像潮水一样漫进来。书页在指尖轻轻翻动，远处的钟声慢慢落下。</p>
      <p>兔耳少女坐在灯下，把今天剩下的故事念完。她说，等下一阵风停了，我们就去找新的章节。</p>
      <p>窗外的城市亮着细碎的光，像一条安静的河。她把书签夹好，笑着拍了拍封面。</p>
